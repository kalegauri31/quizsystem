<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | TY Quiz System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-header">
          <div class="logo">
            <span class="logo-mark">Q</span>
            <span>TY Quiz</span>
          </div>
          <h2>Welcome back</h2>
          <p>Login to continue your learning journey.</p>
        </div>

        <form class="auth-form" id="loginForm">
          <label>
            <span>Email</span>
            <input
              type="email"
              name="email"
              placeholder="name@example.com"
              autocomplete="username"
              maxlength="254"
              required
            />
          </label>

          <label>
            <span>Password</span>
            <span class="password-field">
              <input
                id="loginPassword"
                type="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                minlength="8"
                maxlength="128"
                required
              />
              <button class="password-toggle" type="button" data-password-toggle aria-controls="loginPassword" aria-label="Show password" aria-pressed="false">Show</button>
            </span>
          </label>

          <div class="form-row between">
            <label class="checkbox-inline">
              <input type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-message" data-auth-message role="status" aria-live="polite"></p>

        <p class="auth-switch">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>
        <p class="auth-note">Demo login: accounts are saved in this browser only.</p>
        <p class="auth-switch">
          Are you an admin?
          <a href="assets/admin/admin-login.html">Admin login</a>
        </p>
      </div>
    </div>

    <script src="assets/script.js"></script>
  </body>
</html>
